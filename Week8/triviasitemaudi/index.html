<!DOCTYPE html>

<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <title>Michael Audi's Trivia Page</title>
</head>

<body>
    <div class="header">
        <h1>Michael Audi's Trivia Page!</h1>
    </div>

    <div class="container">
        <div class="section">
            <h2>Part 1: Multiple Choice </h2>
            <hr>
            <!-- TODO: Add multiple choice question here -->
            <h3 class="q1">
                In the movie Toy Story, what is the name of Buzz Lightyear's space agency?
            </h3>
            <button class="q1but" type="button">Galactic Coalition</button>
            <button class="q1but" type="button">Star Command</button>
            <button class="q1but" type="button">Galactic Federation</button>
            <button class="q1but" type="button">United Earth Empire</button>

        </div>

        <div class="section">
            <h2>Part 2: Free Response</h2>
            <hr>
            <h3 class="q2">
                What is the oldest national park?
            </h3>
            <!-- TODO: Add free response question here -->
            <label for="park">Enter the oldest national park:</label>
            <input class="q2ans" type="text" id="park" name="park">
            <button class="q2but" type="button">Submit</button>
        </div>
    </div>
    <script>
        // TODO: Add code to check answers to questions
        const q1 = document.querySelector('.q1');
        const feedback1 = document.createElement('p');
        const q1answ = 'Star Command';

        const q1btns = document.querySelectorAll('.q1but');
        q1btns.forEach(button => {
            button.addEventListener('click', (event) => {
                button.classList.add('userselect');
                q1btns.forEach(btn => {
                    if (btn.innerText === q1answ) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('incorrect');
                    }
                    btn.disabled = true;
                });
                if (button.innerText === q1answ) {
                    feedback1.innerText = 'Correct!';
                    q1.after(feedback1);
                } else {
                    feedback1.innerText = 'Incorrect!';
                    q1.after(feedback1);
                }
            });
        });

        const q2 = document.querySelector('.q2');
        const feedback2 = document.createElement('p');
        const q2btn = document.querySelector('.q2but');
        const q2ansin = document.querySelector('.q2ans');
        const q2answ = 'yellowstone';

        q2btn.addEventListener('click', (event) => {
            q2value = q2ansin.value.trim().toLowerCase();
            if (q2value === q2answ) {
                q2btn.classList.add('correct');
                q2ansin.classList.add('correct');

                feedback2.innerText = 'Correct!';
                q2.after(feedback2);
            } else {
                q2btn.classList.add('incorrect');
                q2ansin.classList.add('incorrect');

                feedback2.innerText = 'Incorrect!';
                q2.after(feedback2);
            }
            q2ansin.disabled = true;
            q2btn.disabled = true;
        });
    </script>
</body>

</html>
